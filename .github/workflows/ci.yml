name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: clippy
      - name: Native build tools (rdkafka, aws-lc)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential perl pkg-config libcurl4-openssl-dev libsasl2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the store's Postgres tests (they skip without it).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/connect_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - name: Native build tools (rdkafka, aws-lc)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential perl pkg-config libcurl4-openssl-dev libsasl2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - name: Native build tools (rdkafka, aws-lc)
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential perl pkg-config libcurl4-openssl-dev libsasl2-dev jq
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh

  docker:
    name: docker build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: meili-connect:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke test
        run: |
          # No auth is configured here, so the server only starts with the explicit opt-in.
          docker run -d --name smoke -p 8080:8080 -e ALLOW_OPEN_MODE=true meili-connect:ci
          for _ in $(seq 1 30); do
            if curl -sf localhost:8080/health; then docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
