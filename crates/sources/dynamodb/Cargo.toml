[package]
name = "meili-connect-source-dynamodb"
description = "DynamoDB source: Scan snapshot and DynamoDB Streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meili-connect-core.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# AWS SDK: default features off (they pull the legacy hyper 0.14 client and
# SSO); keep only the tokio runtime and the default rustls HTTPS client.
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-credential-types = { version = "1.3", default-features = false }
aws-sdk-dynamodb = { version = "1.140", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-dynamodbstreams = { version = "1.126", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-sdk-sts = { version = "1.127", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-smithy-types = "1.9"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
